
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome (icons এর জন্য) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- MDB UI Kit CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css" rel="stylesheet">


<!-- content -->
<section class="py-5">
  <div class="container">
    <div class="row gx-5">
      <aside class="col-lg-6">
        <div class="border rounded-4 mb-3 d-flex justify-content-center">

    {% if product.image %}
        <img
            style="max-width: 100%; max-height: 100vh; margin: auto;"
            class="rounded-4 fit"
            src="{{ product.image.url }}"
        />
    {% else %}
        <img
            style="max-width: 100%; max-height: 100vh; margin: auto;"
            class="rounded-4 fit"
            src="/static/default-product.png"
        />
    {% endif %}

        </div>

        <!-- thumbs-wrap.// -->
        <!-- gallery-wrap .end// -->
      </aside>
      <main class="col-lg-6">
        <div class="ps-lg-3">
          <h4 class="title text-dark">
            {{ product.title }}
          </h4>
          <div class="d-flex flex-row my-3">
            <div class="text-warning mb-1 me-2">
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fas fa-star-half-alt"></i>
              <span class="ms-1">
                4.5
              </span>
            </div>
            <span class="text-muted"><i class="fas fa-shopping-basket fa-sm mx-1"></i>154 orders</span>
            <span class="text-success ms-2">In stock</span>
          </div>

          <div class="mb-3">
            <span class="h5">৳{{ product.price }}</span>
            <span class="text-muted">/per item</span>
          </div>

          <p>
            {{ product.description }}
          </p>

          <div class="row">
           <dt class="col-3">Category:</dt>
           <dd class="col-9">{{ product.category }}</dd>

           <dt class="col-3">Stock:</dt>
           <dd class="col-9">{{ product.stock }}</dd>

           <dt class="col-3">Owner:</dt>
           <dd class="col-9">{{ product.owner.username }}</dd>
           </div>

          <hr />


            <!-- col.// -->
            <div class="col-md-4 col-6 mb-3">
              <label class="mb-2 d-block">Quantity</label>
              <div class="input-group mb-3" style="width: 170px;">
                <button class="btn btn-white border border-secondary px-3" type="button" id="button-addon1" data-mdb-ripple-color="dark">
                  <i class="fas fa-minus"></i>
                </button>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    value="1"
                    min="1"
                    max="{{ product.stock }}"
                    class="form-control text-center border border-secondary"
                />
                <button class="btn btn-white border border-secondary px-3" type="button" id="button-addon2" data-mdb-ripple-color="dark">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
<a href="{% url 'listings:add_to_cart' product.id %}" class="btn btn-warning shadow-0">
    Add to cart
</a>

<a href="{% url 'listings:buy_product' product.id %}" class="btn btn-success shadow-0">
    Buy now
</a>
        </div>
      </main>
    </div>
  </div>
</section>
<!-- content -->


<!-- Footer -->

<!-- Footer -->
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- MDB UI Kit JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    let qtyInput = document.getElementById("quantity");

    document.getElementById("button-addon1").addEventListener("click", function () {
        let value = parseInt(qtyInput.value);
        if (value > 1) {
            qtyInput.value = value - 1;
        }
    });

    document.getElementById("button-addon2").addEventListener("click", function () {
        let value = parseInt(qtyInput.value);
        let max = parseInt(qtyInput.max || 9999);

        if (value < max) {
            qtyInput.value = value + 1;
        }
    });

});
</script>
