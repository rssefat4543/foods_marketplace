<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Realtime Chat</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --brand:#8b5cf6;
      --brand-2:#38bdf8;

      /* DARK MODE */
      --bg:#0b1220;
      --surface:#111827;
      --surface-2:#1f2937;

      --text:#e5e7eb;
      --muted:#94a3b8;
      --border:#263041;

      --gradient-brand:linear-gradient(135deg,#8b5cf6,#38bdf8);

      --bubble-me:linear-gradient(135deg,#8b5cf6,#6d28d9);
      --bubble-them:#1e293b;

      --shadow-soft:0 10px 30px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      height:100%;
      margin:0;
    }

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);

      display:flex;
      justify-content:center;
      align-items:center;

      padding:16px;
      overflow:hidden;
    }

    /* =========================
       CHAT CONTAINER
    ========================= */

    .chat{
      width:50%;
      height:95vh;

      background:var(--surface);

      border-radius:24px;

      overflow:hidden;

      display:flex;
      flex-direction:column;

      border:1px solid var(--border);

      box-shadow:var(--shadow-soft);
    }

    /* =========================
       HEADER
    ========================= */

    .chat-header{
      display:flex;
      align-items:center;
      gap:12px;

      padding:16px 20px;

      border-bottom:1px solid var(--border);

      background:var(--surface);

      flex-shrink:0;
    }

    .avatar img{
      width:44px;
      height:44px;

      border-radius:50%;
      object-fit:cover;
    }

    .who{
      flex:1;
      min-width:0;
    }

    .name{
      font-weight:600;
      color:var(--text);

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .status{
      font-size:.82rem;
      color:#22c55e;
    }

    .icon-btn{
      width:40px;
      height:40px;

      border:none;
      border-radius:12px;

      background:transparent;

      display:grid;
      place-items:center;

      color:var(--muted);

      cursor:pointer;

      transition:.2s;
    }

    .icon-btn:hover{
      background:var(--surface-2);
      color:var(--text);
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages{
      flex:1;

      overflow-y:auto;

      padding:20px;

      display:flex;
      flex-direction:column;

      gap:14px;

      background:var(--bg);
    }

    .messages::-webkit-scrollbar{
      width:6px;
    }

    .messages::-webkit-scrollbar-thumb{
      background:#334155;
      border-radius:999px;
    }

    .day-divider{
      align-self:center;

      font-size:.75rem;
      color:var(--muted);

      padding:6px 12px;

      border-radius:999px;

      background:var(--surface);

      border:1px solid var(--border);
    }

    .msg{
      display:flex;
      gap:8px;

      max-width:75%;
    }

    .msg.them{
      align-self:flex-start;
    }

    .msg.me{
      align-self:flex-end;
      flex-direction:row-reverse;
    }

    .msg img.av{
      width:30px;
      height:30px;

      border-radius:50%;

      align-self:flex-end;
    }

    .bubble{
      padding:12px 14px;

      border-radius:18px;

      font-size:.94rem;

      line-height:1.45;

      word-wrap:break-word;

      box-shadow:var(--shadow-soft);
    }

    .msg.them .bubble{
      background:var(--bubble-them);
      color:var(--text);

      border-bottom-left-radius:6px;
    }

    .msg.me .bubble{
      background:var(--bubble-me);
      color:white;

      border-bottom-right-radius:6px;
    }

    .meta{
      font-size:.7rem;
      color:var(--muted);

      margin-top:5px;
    }

    .msg.me .meta{
      text-align:right;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer{
      padding:14px 18px;

      border-top:1px solid var(--border);

      background:var(--surface);

      flex-shrink:0;
    }

    .composer-inner{
      display:flex;
      align-items:flex-end;
      gap:8px;

      background:var(--surface-2);

      border-radius:18px;

      border:1px solid var(--border);

      padding:8px 10px;
    }

    textarea{
      flex:1;

      border:none;
      outline:none;

      resize:none;

      background:transparent;

      color:var(--text);

      max-height:140px;

      font-size:.95rem;

      font-family:inherit;

      padding:8px 4px;
    }

    textarea::placeholder{
      color:var(--muted);
    }

    .send-btn{
      width:44px;
      height:44px;

      border:none;
      border-radius:14px;

      background:var(--gradient-brand);

      color:white;

      display:grid;
      place-items:center;

      cursor:pointer;

      flex-shrink:0;
    }

    /* =========================
       TABLET
    ========================= */

    @media(max-width:1024px){

      .chat{
        width:80%;
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px){

      body{
        padding:0;
        align-items:stretch;
      }

      .chat{
        width:100%;
        height:100vh;

        border-radius:0;
      }

      .msg{
        max-width:88%;
      }

      .chat-header{
        padding:14px;
      }

      .messages{
        padding:14px;
      }

      .composer{
        padding:10px;
      }

      .icon-btn{
        width:36px;
        height:36px;
      }

      .send-btn{
        width:42px;
        height:42px;
      }

    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media(max-width:480px){

      .name{
        font-size:.95rem;
      }

      .status{
        font-size:.75rem;
      }

      .bubble{
        font-size:.9rem;
      }

    }

  </style>
</head>

<body>

  <section class="chat">

    <!-- HEADER -->

    <header class="chat-header">

      <div class="avatar">
        <img src="https://i.pravatar.cc/80?img=47">
      </div>

      <div class="who">

        <div class="name">
          {{ other_user.username }}
        </div>

        <div class="status">
          <i class="bi bi-circle-fill" style="font-size:.5rem"></i>
          Active now
        </div>

      </div>

      <button class="icon-btn">
        <i class="bi bi-telephone"></i>
      </button>

      <button class="icon-btn">
        <i class="bi bi-camera-video"></i>
      </button>

    </header>

    <!-- MESSAGES -->

    <div class="messages" id="messages">

      <div class="day-divider">
        Today
      </div>

    </div>

    <!-- COMPOSER -->

    <form class="composer" id="composer">

      <div class="composer-inner">

        <button type="button" class="icon-btn">
          <i class="bi bi-paperclip"></i>
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="Write a message..."
        ></textarea>

        <button type="submit" class="send-btn">
          <i class="bi bi-send-fill"></i>
        </button>

      </div>

    </form>

  </section>

  <script>

    const receiverId = "{{ id }}";
    const currentUserId = "{{ request.user.id }}";

    const wsScheme =
      window.location.protocol === "https:" ? "wss" : "ws";

    const socket = new WebSocket(
      wsScheme +
      "://" +
      window.location.host +
      "/ws/chat/" +
      receiverId +
      "/"
    );

    const messages = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");

    // ======================
    // SOCKET CONNECT
    // ======================

    socket.onopen = function () {
      console.log("Connected");
    };

    // ======================
    // RECEIVE MESSAGE
    // ======================

    socket.onmessage = function (e) {

      const data = JSON.parse(e.data);

      console.log(data);

      // ======================
      // HISTORY
      // ======================

      if (data.message_history) {

        data.message_history.forEach(msg => {

          renderMessage(
            msg.message,
            msg.timestamp,
            String(msg.sender_id) === String(currentUserId)
          );

        });

        scrollBottom();
        return;
      }

      // ======================
      // LIVE MESSAGE
      // ======================

      renderMessage(
        data.message,
        data.timestamp,
        String(data.sender_id) === String(currentUserId)
      );

      scrollBottom();
    };

    // ======================
    // RENDER MESSAGE
    // ======================

    function renderMessage(message, timestamp, isMe){

      const messageHTML = `

        <div class="msg ${isMe ? 'me' : 'them'}">

          ${!isMe ? `
            <img
              class="av"
              src="https://i.pravatar.cc/60?img=47"
            >
          ` : ''}

          <div>

            <div class="bubble">
              ${escapeHTML(message)}
            </div>

            <div class="meta">
              ${timestamp}
            </div>

          </div>

        </div>

      `;

      messages.insertAdjacentHTML(
        "beforeend",
        messageHTML
      );
    }

    // ======================
    // SEND MESSAGE
    // ======================

    composer.addEventListener("submit", function (e) {

      e.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      socket.send(JSON.stringify({
        message: message
      }));

      input.value = "";

      input.style.height = "auto";
    });

    // ======================
    // AUTO RESIZE TEXTAREA
    // ======================

    input.addEventListener("input", () => {

      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 140) + "px";
    });

    // ======================
    // HELPERS
    // ======================

    function scrollBottom(){

      messages.scrollTop =
        messages.scrollHeight;
    }

    function escapeHTML(str){

      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ======================
    // SOCKET CLOSE
    // ======================

    socket.onclose = function () {
      console.log("Disconnected");
    };

  </script>

</body>
</html>
