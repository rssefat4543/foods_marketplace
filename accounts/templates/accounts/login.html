<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 px-6">

    <div class="w-full max-w-xl bg-white p-12 lg:p-8 rounded-3xl shadow-2xl">

        <h2 class="text-5xl lg:text-3xl font-bold text-center mb-12 lg:mb-8 text-gray-800">
            Login
        </h2>

        <form method="POST" class="space-y-10 lg:space-y-6">
            {% csrf_token %}

            <input
                name="email"
                placeholder="Email"
                class="w-full p-8 lg:p-4 text-2xl lg:text-base border rounded-3xl focus:outline-none focus:ring-4 focus:ring-blue-500"
            >

            <div class="relative">
                <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    placeholder="Password"
                    class="w-full p-8 lg:p-4 text-2xl lg:text-base border rounded-3xl pr-24 focus:outline-none focus:ring-4 focus:ring-blue-500"
                >

                <button
                    type="button"
                    onclick="togglePassword('loginPassword')"
                    class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-500"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-8 lg:py-3 rounded-3xl font-bold text-3xl lg:text-base hover:bg-blue-700 transition"
            >
                Login
            </button>
        </form>

        {% if messages %}
        <div class="mt-10 space-y-4">
            {% for message in messages %}
                {% if request.resolver_match.url_name == 'login' %}
                <div class="p-6 lg:p-3 rounded-2xl text-xl lg:text-sm bg-red-100 text-red-700">
                    {{ message }}
                </div>
                {% endif %}
            {% endfor %}
        </div>
        {% endif %}

        <div class="mt-12 text-center text-2xl lg:text-base space-y-6">
            <a href="{% url 'forgot' %}" class="text-blue-600">
                Forgot Password?
            </a>

            <p class="text-gray-600">
                Don’t have an account?
                <a href="{% url 'register' %}" class="text-blue-600 font-bold">
                    Register
                </a>
            </p>
        </div>

    </div>
</div>

<script>
function togglePassword(fieldId) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
