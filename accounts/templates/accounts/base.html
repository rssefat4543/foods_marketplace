<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        html { font-size: 16px; }

        @media (max-width: 768px) {
            html { font-size: 18px; }
        }

        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

<!-- ================= NAVBAR ================= -->
{% if request.user.is_authenticated %}

<nav class=" dark:bg-gray-800 shadow-md sticky top-0 z-50">

  <div class="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8">

    <div class="flex items-center justify-between py-3">

      <!-- LOGO -->
      <a href="{% url 'listings:dashboard' %}"
         class="flex items-center gap-2 text-xl font-bold text-gray-900 dark:text-white">

        <span class="text-primary">
          <svg width="32" height="32" viewBox="0 0 34 34" fill="currentColor">
            <circle cx="17" cy="17" r="16"/>
          </svg>
        </span>

        Marketplace
      </a>

      <!-- NAV LINKS (desktop) -->
      <div class="hidden lg:flex items-center gap-6 text-sm font-medium">
        <a href="#home" class="hover:text-primary">Home</a>
        <a href="#about-us" class="hover:text-primary">About</a>
        <a href="#services" class="hover:text-primary">Products</a>
        <a href="#faqs" class="hover:text-primary">FAQ</a>
      </div>

      <!-- RIGHT SIDE -->
      <div class="flex items-center gap-4">

        <!-- SEARCH -->
        <div class="hidden md:block">
          <form method="GET" action="{% url 'listings:dashboard' %}">
            <input type="text"
                   name="q"
                   placeholder="Search products..."
                   class="px-3 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-black dark:text-white border-0">
          </form>
        </div>

        <!-- ADD PRODUCT -->
        <a href="{% url 'listings:add_product' %}"
           class="btn btn-success btn-sm">
          + Add
        </a>

        <!-- NOTIFICATIONS -->
        <a href="{% url 'listings:notifications' %}" style="position:relative; display:inline-block;" class="text-gray-700 dark:text-white">
          <i class="bi bi-bell fs-5"></i>
 
  {% if unread_count > 0 %}
    <span style="
        position:absolute;
        top:-6px;
        right:-8px;
        background:red;
        color:white;
        border-radius:50%;
        padding:2px 6px;
        font-size:12px;">
        {{ unread_count }}
    </span>
  {% endif %}
  
        </a>

        <!-- PROFILE -->
        <a href="{% url 'profile_view' %}">
          <div class="w-10 h-10 rounded-full overflow-hidden bg-gray-500 flex items-center justify-center">
            {% if nav_profile and nav_profile.image %}
              <img src="{{ nav_profile.image.url }}"
                   class="w-full h-full object-cover">
            {% else %}
              <i class="bi bi-person text-white"></i>
            {% endif %}
          </div>
        </a>

      </div>

    </div>
  </div>

</nav>

{% endif %}

<!-- ================= PAGE CONTENT ================= -->
<div class="min-h-screen p-4 md:p-6">
    {% block content %}{% endblock %}
</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // loader
    document.querySelectorAll("form").forEach(form => {
        form.addEventListener("submit", function () {
            const loader = document.getElementById("globalLoader");
            if (loader) loader.style.display = "flex";
        });
    });

    // broken images fallback
    document.addEventListener("error", function (e) {
        if (e.target.tagName === "IMG") {
            e.target.style.display = "none";
        }
    }, true);
</script>

</body>
</html>
