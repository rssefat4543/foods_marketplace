<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        html { font-size: 16px; }

        @media (max-width: 768px) {
            html { font-size: 18px; }
        }



        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-gray-100">



{% if request.user.is_authenticated %}

<!-- NAVBAR -->
<div class="bg-white shadow-md sticky top-0 z-50 w-full">

    <div class="container-fluid px-3 py-3">
        <div class="d-flex align-items-center justify-content-between gap-3">

            <!-- LOGO -->
            <a href="{% url 'listings:dashboard' %}"
               class="fw-bold fs-5 text-dark text-decoration-none flex-shrink-0">
                Marketplace
            </a>

            <!-- SEARCH (DESKTOP) -->
            <div class="d-none d-md-flex flex-grow-1 mx-3">
                <form method="GET" action="{% url 'listings:dashboard' %}" class="w-100">
                    <input type="text" name="q"
                           placeholder="Search products..."
                           class="form-control rounded-pill px-3 py-2">
                </form>
            </div>

            <!-- RIGHT ACTIONS -->
            <div class="d-flex align-items-center gap-3 flex-shrink-0">

                <!-- MOBILE SEARCH ICON -->
                <button type="button" class="btn btn-sm d-md-none"
                        onclick="toggleMobileSearch()">
                    <i class="bi bi-search fs-5"></i>
                </button>

                <a href="{% url 'chat:notifications' %}" class="icon-btn">
                    <i class="bi bi-chat-dots-fill"></i>
                </a>

                <a href="{% url 'listings:add_product' %}"
                   class="btn btn-success btn-sm px-3">
                    + Add
                </a>

                <!-- PROFILE -->
<!-- PROFILE -->
<a href="{% url 'profile_view' %}">
    <div class="rounded-circle overflow-hidden d-flex align-items-center justify-content-center bg-secondary text-white"
         style="width:45px; height:45px;">
        {% if nav_profile and nav_profile.image %}
            <img src="{{ nav_profile.image.url }}"
                 class="w-100 h-100"
                 style="object-fit: cover;">
        {% else %}
            <i class="bi bi-person fs-4"></i>
        {% endif %}
    </div>
</a>

            </div>
        </div>
    </div>

    <!-- MOBILE SEARCH -->
    <div id="mobileSearchWrap" class="d-md-none px-3 pb-3 d-none">
        <form method="GET" action="{% url 'listings:dashboard' %}">
            <input type="text"
                   name="q"
                   placeholder="Search products..."
                   class="form-control rounded-pill">
        </form>
    </div>

</div>
{% endif %}

<!-- PAGE CONTENT -->
<div class="p-3 md:p-4">
    {% block content %}{% endblock %}
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>



    function toggleMobileSearch() {
        const el = document.getElementById("mobileSearchWrap");
        if (el) el.classList.toggle("d-none");
    }

    // form submit loader
    document.querySelectorAll("form").forEach(form => {
        form.addEventListener("submit", function () {
            const loader = document.getElementById("globalLoader");
            if (loader) loader.style.display = "flex";
        });
    });

    // hide broken images safely
    document.addEventListener("error", function (e) {
        if (e.target.tagName === "IMG") {
            e.target.style.display = "none";
        }
    }, true);


</script>

</body>
</html>
