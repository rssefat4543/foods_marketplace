<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-green-100 px-3 sm:px-6">

    <div class="
        w-full
        max-w-md
        bg-white
        p-6 sm:p-8
        rounded-3xl
        shadow-2xl
        sm:shadow-lg
    ">

        <h2 class="text-2xl sm:text-xl font-bold text-center mb-6 text-gray-800">
            Register
        </h2>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <input
                name="username"
                placeholder="Username"
                class="
                    w-full
                    p-4
                    sm:p-3
                    text-base
                    border
                    rounded-xl
                    focus:outline-none
                    focus:ring-2
                    focus:ring-green-500
                "
            >

            <input
                name="email"
                placeholder="Email"
                class="
                    w-full
                    p-4
                    sm:p-3
                    text-base
                    border
                    rounded-xl
                    focus:outline-none
                    focus:ring-2
                    focus:ring-green-500
                "
            >

            <div class="relative">
                <input
                    id="regPassword"
                    name="password"
                    type="password"
                    placeholder="Password"
                    class="
                        w-full
                        p-4
                        sm:p-3
                        text-base
                        border
                        rounded-xl
                        pr-14
                        focus:outline-none
                        focus:ring-2
                        focus:ring-green-500
                    "
                >

                <button
                    type="button"
                    onclick="togglePassword('regPassword', this)"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button
                type="submit"
                class="
                    w-full
                    bg-green-600
                    text-white
                    py-4
                    sm:py-3
                    rounded-xl
                    font-semibold
                    text-lg
                    sm:text-base
                    hover:bg-green-700
                    transition
                "
            >
                Register
            </button>
        </form>

    {% if messages %}
<div class="mt-4 space-y-2">
    {% for message in messages %}
        {% if request.resolver_match.url_name == 'register' %}
        <div class="p-4 rounded-xl text-sm bg-red-100 text-red-700">
            {{ message }}
        </div>
        {% endif %}
    {% endfor %}
</div>
{% endif %}
        <p class="text-sm mt-6 text-center text-gray-600">
            Already have an account?
            <a href="{% url 'login' %}" class="text-green-600 font-medium">
                Login
            </a>
        </p>

    </div>
</div>

<script>
function togglePassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
