<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-gray-900 to-black px-6">

    <div class="w-full max-w-xl bg-gray-800 p-12 lg:p-8 rounded-3xl shadow-2xl border border-gray-700">

        <h2 class="text-5xl lg:text-3xl font-bold text-center mb-12 lg:mb-8 text-white">
            Register
        </h2>

        <form method="POST" class="space-y-10 lg:space-y-6">
            {% csrf_token %}

            <input
                name="username"
                placeholder="Username"
                class="w-full p-8 lg:p-4 text-2xl lg:text-base bg-gray-700 border border-gray-600 text-white placeholder-gray-400 rounded-3xl focus:outline-none focus:ring-4 focus:ring-green-500"
            >

            <input
                name="email"
                placeholder="Email"
                class="w-full p-8 lg:p-4 text-2xl lg:text-base bg-gray-700 border border-gray-600 text-white placeholder-gray-400 rounded-3xl focus:outline-none focus:ring-4 focus:ring-green-500"
            >

            <div class="relative">
                <input
                    id="regPassword"
                    name="password"
                    type="password"
                    placeholder="Password"
                    class="w-full p-8 lg:p-4 text-2xl lg:text-base bg-gray-700 border border-gray-600 text-white placeholder-gray-400 rounded-3xl pr-24 focus:outline-none focus:ring-4 focus:ring-green-500"
                >

                <button
                    type="button"
                    onclick="togglePassword('regPassword')"
                    class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button
                type="submit"
                class="w-full bg-green-600 text-white py-8 lg:py-3 rounded-3xl font-bold text-3xl lg:text-base hover:bg-green-700 transition"
            >
                Register
            </button>
        </form>

        {% if messages %}
        <div class="mt-10 space-y-4">
            {% for message in messages %}
                {% if request.resolver_match.url_name == 'register' %}
                <div class="p-6 lg:p-3 rounded-2xl text-xl lg:text-sm bg-red-900/40 border border-red-700 text-red-300">
                    {{ message }}
                </div>
                {% endif %}
            {% endfor %}
        </div>
        {% endif %}

        <p class="text-2xl lg:text-base mt-12 text-center text-gray-300">
            Already have an account?
            <a href="{% url 'login' %}" class="text-green-400 font-bold hover:text-green-300">
                Login
            </a>
        </p>

    </div>
</div>

<script>
function togglePassword(fieldId) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
